<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pyodide 試作</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 16px; max-width: 900px; }
      textarea { width: 100%; height: 180px; font-family: ui-monospace, monospace; font-size: 14px; }
      pre { background: #f4f3ef; padding: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
      button { margin-right: 8px; }
    </style>
  </head>
  <body>
    <h1>Pyodide 試作(Worker + settrace)</h1>
    <p>状態: <span id="status">-</span></p>
    <textarea id="code">a = [1, 2]
b = a
b.append(3)
print(a)</textarea>
    <p>
      <button id="run">実行</button>
      <button id="stop">止める</button>
      <button id="loop">無限ループ (Python)</button>
      <button id="heavy">重い組み込み処理</button>
    </p>
    <p>ステップ <input id="step" type="range" min="0" max="0" value="0" /> <span id="stepLabel"></span></p>
    <h2>出力</h2>
    <pre id="out"></pre>
    <h2>この時点の記録</h2>
    <pre id="snap"></pre>
    <script type="module" src="/src/proto/main.ts"></script>
  </body>
</html>
